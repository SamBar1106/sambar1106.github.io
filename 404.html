<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Loom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand-logo" href="/">
        <span>Loom</span>
        <span class="brand-dot" aria-hidden="true"></span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <div class="nav-actions">
          <a class="btn btn-outline-dark" href="/loom/sign-in">Log in</a>
          <a class="btn btn-primary" href="/loom/sign-up">Sign up</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="hero-section" aria-labelledby="not-found-heading">
      <div class="container">
        <div class="hero-content">
          <h1 id="not-found-heading" class="hero-title">Page not found.</h1>
          <p class="hero-subhead">The page you are looking for does not exist.</p>
          <div class="hero-actions">
            <a class="btn btn-lg btn-primary" href="/">Back to Loom</a>
            <a class="btn btn-lg btn-outline-dark" href="/loom/sign-in">Log in</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p class="footer-brand-line">
          <span>Loom</span>
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="footer-copy">· © 2026 Loom LLC</span>
        </p>
        <p class="footer-stripe">Payments powered by Stripe.</p>
      </div>
    </div>
  </footer>
</body>
</html>
